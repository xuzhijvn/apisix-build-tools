name: package apisix rpm for el7

on:
  push:
    branches: [ master, htaizq_* ]
    tags:
      - "v*"
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [ master, htaizq_* ]
    paths-ignore:
      - '*.md'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      apisix_version:
        description: 'APISIX version to package'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APISIX_VERSION: ${{ github.event.inputs.apisix_version || github.ref_name }}
#    services:
#      etcd:
#        image: quay.io/coreos/etcd:v3.5.9
#        ports:
#          - 2379:2379
#          - 2380:2380
#        env:
#          ALLOW_NONE_AUTHENTICATION: yes
#          ETCD_ADVERTISE_CLIENT_URLS: http://0.0.0.0:2379

    steps:
      - uses: actions/checkout@v2

      - name: start etcd
        run: |
          docker run -d \
            --name etcd \
            --net host \
            quay.io/coreos/etcd:v3.5.9 \
            /usr/local/bin/etcd \
              --advertise-client-urls http://127.0.0.1:2379 \
              --listen-client-urls http://0.0.0.0:2379

      - name: install dependencies
        run: |
          sudo apt-get install -y make ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm
          sudo apt-get install -y rpm

      - name: packaging APISIX(-remote) with remote code
        run: |
          wget https://raw.githubusercontent.com/xuzhijvn/apisix/${APISIX_VERSION}/.requirements && source .requirements
          make package type=rpm app=apisix version=master checkout=${APISIX_VERSION} runtime_version=${APISIX_RUNTIME} image_base=centos image_tag=7 artifact=apisix-remote

#      - name: packaging APISIX(-local) with local code
#        run: |
#          wget https://raw.githubusercontent.com/xuzhijvn/apisix/${APISIX_VERSION}/.requirements && source .requirements
#          git clone -b ${APISIX_VERSION} https://github.com/xuzhijvn/apisix.git
#          make package type=rpm app=apisix version=master checkout=${APISIX_VERSION} runtime_version=${APISIX_RUNTIME} image_base=centos image_tag=7 local_code_path=./apisix artifact=apisix-local

      - name: run centos7 docker and mapping rpm into container
        run: |
          docker run -itd -v $PWD/output:/output --name centos7Instance --net="host" docker.io/centos:7 /bin/bash

      - name: enable apisix repository in container
        run: |
          docker exec centos7Instance bash -c "rpm --import https://repos.apiseven.com/KEYS"
          docker exec centos7Instance bash -c "yum -y install https://repos.apiseven.com/packages/centos/apache-apisix-repo-1.0-1.noarch.rpm"

      - name: fix centos7 repo inside test container
        run: |
          docker exec centos7Instance bash -c "\
            sed -re 's/^#?\s*(mirrorlist)/#\1/g' \
                -e 's|^#?\s*baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' \
                -i /etc/yum.repos.d/CentOS-* \
          "
          docker exec centos7Instance bash -c 'printf "[sclo-rh]\nname=CentOS-7 - SCLo rh\nbaseurl=http://vault.centos.org/centos/7/sclo/x86_64/rh/\ngpgcheck=0\nenabled=1\n\n[sclo-sclo]\nname=CentOS-7 - SCLo sclo\nbaseurl=http://vault.centos.org/centos/7/sclo/x86_64/sclo/\ngpgcheck=0\nenabled=1\n" > /etc/yum.repos.d/CentOS-SCLo-vault.repo'

      - name: install APISIX(-remote) master by rpm in container
        run: |
          docker exec centos7Instance bash -c "yum -y localinstall /output/apisix-remote-master-0.el7.x86_64.rpm"
          docker exec centos7Instance bash -c "apisix start"

      - name: check and ensure APISIX(-remote) master is installed
        run: |
          code=$(curl -k -i -m 20 -o /dev/null -s -w %{http_code} http://127.0.0.1:9180/apisix/admin/routes -H 'X-API-KEY: edd1c9f034335f136f87ad84b625c8f1')
          if [ ! $code -eq 200 ]; then
              echo "failed: failed to install Apache APISIX by rpm"
              exit 1
          fi

      - name: stop and uninstall APISIX(-remote) master
        run: |
          docker exec centos7Instance bash -c "pkill -f nginx"
          docker exec centos7Instance bash -c "yum -y erase apisix-remote-master"

#      - name: install APISIX(-local) by rpm in container
#        run: |
#          docker exec centos7Instance bash -c "yum -y localinstall /output/apisix-local-master-0.el7.x86_64.rpm"
#          docker exec centos7Instance bash -c "apisix start"

#      - name: check and ensure APISIX(-local) is installed
#        run: |
#          code=$(curl -k -i -m 20 -o /dev/null -s -w %{http_code} http://127.0.0.1:9180/apisix/admin/routes -H 'X-API-KEY: edd1c9f034335f136f87ad84b625c8f1')
#          if [ ! $code -eq 200 ]; then
#              echo "failed: failed to install Apache APISIX by rpm"
#              exit 1
#          fi

      - name: install yumdownloader tools inside centos7 container
        run: |
          docker exec centos7Instance bash -c "yum install -y yum-utils"

      - name: download offline dependencies
        run: |
          docker exec centos7Instance bash -c "\
            mkdir -p /output/deps \
            && yumdownloader --resolve --destdir=/output/deps /output/apisix-remote-master-0.el7.x86_64.rpm || true \
          "    

      - name: archive offline installation package
        run: |
          TAR_NAME="api6_${APISIX_VERSION}-0_el7.x86_64.tar.gz"
          tar -czvf $TAR_NAME output/
          echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAR_NAME }}
          path: ${{ env.TAR_NAME }}